name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-numerics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight verification environment
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile source
        run: python -m compileall -q src scripts tests
      - name: Run core numerical tests
        run: pytest -q
